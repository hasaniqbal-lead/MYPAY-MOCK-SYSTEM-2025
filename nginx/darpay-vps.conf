# ===========================================
# DarPay - Nginx VPS Configuration
# Isolated configuration for vstore.cloud domains
# Place in: /etc/nginx/sites-available/darpay.conf
# ===========================================

# Upstream servers for DarPay
upstream darpay-payout-api {
    server localhost:4101;
}

upstream darpay-payment-api {
    server localhost:4102;
}

upstream darpay-merchant-portal {
    server localhost:4110;
}

upstream darpay-admin-portal {
    server localhost:4111;
}

upstream darpay-payment-page {
    server localhost:4112;
}

# ===========================================
# darpay.vstore.cloud - Main Website
# ===========================================
server {
    listen 80;
    server_name darpay.vstore.cloud;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name darpay.vstore.cloud;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darpay.vstore.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Logging
    access_log /var/log/nginx/darpay-main.access.log;
    error_log /var/log/nginx/darpay-main.error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static website (if exists) or redirect to merchant portal
    location / {
        root /var/www/darpay;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ===========================================
# api-darpay.vstore.cloud - API Gateway
# ===========================================
server {
    listen 80;
    server_name api-darpay.vstore.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api-darpay.vstore.cloud;

    ssl_certificate /etc/letsencrypt/live/api-darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-darpay.vstore.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/darpay-api.access.log;
    error_log /var/log/nginx/darpay-api.error.log;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Payout API
    location /api/v1/payouts {
        proxy_pass http://darpay-payout-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Payment API
    location /api/v1 {
        proxy_pass http://darpay-payment-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://darpay-payment-api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ===========================================
# sbx-darpay.vstore.cloud - Sandbox API
# ===========================================
server {
    listen 80;
    server_name sbx-darpay.vstore.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sbx-darpay.vstore.cloud;

    ssl_certificate /etc/letsencrypt/live/sbx-darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sbx-darpay.vstore.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/darpay-sandbox.access.log;
    error_log /var/log/nginx/darpay-sandbox.error.log;

    add_header X-Sandbox-Mode "true" always;

    # Route to same APIs but potentially with different behavior
    location / {
        proxy_pass http://darpay-payment-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sandbox "true";
    }
}

