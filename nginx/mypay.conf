# ===========================================
# MyPay Mock Platform - Nginx Configuration
# ===========================================

# Upstream servers
upstream payout-api {
    server localhost:4001;
}

upstream payment-api {
    server localhost:4002;
}

upstream merchant-portal {
    server localhost:4010;
}

upstream admin-portal {
    server localhost:4011;
}

# ===========================================
# DARPAY VSTORE.CLOUD DOMAIN CONFIGURATION
# ===========================================

# ===========================================
# darpay.vstore.cloud - Main Website
# ===========================================
server {
    listen 80;
    server_name darpay.vstore.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name darpay.vstore.cloud;

    # SSL certificates (to be configured)
    ssl_certificate /etc/letsencrypt/live/darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darpay.vstore.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/darpay.access.log;
    error_log /var/log/nginx/darpay.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main website content
    location / {
        root /var/www/darpay;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

# ===========================================
# api-darpay.vstore.cloud - API Gateway  
# ===========================================
server {
    listen 80;
    server_name api-darpay.vstore.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-darpay.vstore.cloud;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api-darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-darpay.vstore.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/api-darpay.access.log;
    error_log /var/log/nginx/api-darpay.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Payout API routes
    location /api/v1/payouts {
        proxy_pass http://payout-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/v1/balance {
        proxy_pass http://payout-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/directory {
        proxy_pass http://payout-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment API routes
    location /api/v1/portal {
        proxy_pass http://payment-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/checkout {
        proxy_pass http://payment-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /api/v1/health {
        proxy_pass http://payout-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

