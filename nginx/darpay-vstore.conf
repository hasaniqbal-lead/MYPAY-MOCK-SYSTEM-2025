# ===========================================
# DarPay VPS Deployment Configuration
# Nginx Setup for Isolated Containers
# ===========================================

# Main website
server {
    listen 80;
    listen [::]:80;
    server_name darpay.vstore.cloud;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name darpay.vstore.cloud;

    ssl_certificate /etc/letsencrypt/live/darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darpay.vstore.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/darpay-website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Production API
server {
    listen 80;
    listen [::]:80;
    server_name api-darpay.vstore.cloud;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-darpay.vstore.cloud;

    ssl_certificate /etc/letsencrypt/live/darpay.vstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darpay.vstore.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Payment API endpoints
    location /api/v1/payment {
        proxy_pass http://localhost:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Payout API endpoints
    location /api/v1/payout {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:4002/health;
        proxy_http_version 1.1;
    }
}

